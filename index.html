<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TB Action Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 id="site-title" role="button" tabindex="0" aria-label="TB Action Finder, back to start">TB Action Finder</h1>
      <p class="tagline">Find the most impactful action you can take</p>
    </div>
  </header>
  <main>

    <!-- Screen 1: Country -->
    <section id="screen-country" class="screen active" aria-labelledby="country-heading">
      <h2 id="country-heading" tabindex="-1">Which country are you in?</h2>
      <div class="button-group" role="group" aria-labelledby="country-heading">
        <button class="choice-btn" data-country="US">United States</button>
        <button class="choice-btn" data-country="UK">United Kingdom</button>
        <button class="choice-btn" data-country="CA">Canada</button>
        <button class="choice-btn" data-country="other">Other</button>
      </div>
    </section>

    <!-- Screen 2: Time -->
    <section id="screen-time" class="screen" aria-labelledby="time-heading">
      <h2 id="time-heading" tabindex="-1">How much time do you have?</h2>
      <div class="button-group" role="group" aria-labelledby="time-heading">
        <button class="choice-btn" data-time="tonight">Under 30 minutes, tonight</button>
        <button class="choice-btn" data-time="weekly">About 30 minutes, weekly</button>
        <button class="choice-btn" data-time="deeper">More — I want to go deeper</button>
      </div>
    </section>

    <!-- Screen 3: Results -->
    <section id="screen-results" class="screen" aria-labelledby="results-heading">
      <h2 id="results-heading" tabindex="-1">Your actions</h2>
    </section>
  </main>

  <footer>
    <!-- href and visibility come from emailSignupUrl in actions.json, so a
         failed load leaves no dead link behind. -->
    <p class="footer-signup" hidden>
      <a id="email-signup-link" class="footer-signup-link" target="_blank"
         rel="noopener noreferrer"
         aria-label="Sign up for TBFighters emails (opens in new tab)">Sign up for TBFighters emails</a>
    </p>
    <p>tbfighters.org</p>
    <p class="footer-updated">Last reviewed: 3 July 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
